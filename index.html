<html lang="fr">

<meta charset="UTF-8">

<title>ArchImmo Pro</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',sans-serif; }
  :root {
    --bg:#0a0e1a; --sidebar:#0f1626; --card:#151d2e; --card2:#1a2438;
    --border:#243044; --text:#e8edf5; --muted:#8896ab;
    --immo:#3b82f6; --immo-light:#60a5fa; --arch:#ec4899; --arch-light:#f472b6;
    --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  }
  body { background:var(--bg); color:var(--text); display:flex; min-height:100vh; }

  .sidebar {
    width:280px; background:var(--sidebar); display:flex; flex-direction:column;
    border-right:1px solid var(--border); height:100vh; overflow-y:auto; flex-shrink:0;
  }
  .sidebar::-webkit-scrollbar { width:6px; }
  .sidebar::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  .logo {
    padding:22px 20px; font-size:20px; font-weight:800; letter-spacing:-.5px;
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;
  }
  .logo-icon {
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg,var(--immo),var(--arch));
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .logo span.gradient {
    background:linear-gradient(135deg,var(--immo-light),var(--arch-light));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }

  .switcher {
    display:flex; margin:14px; padding:4px; background:var(--bg);
    border-radius:10px; border:1px solid var(--border);
  }
  .switch-btn {
    flex:1; padding:9px; text-align:center; border-radius:7px; cursor:pointer;
    font-size:12px; font-weight:600; transition:.2s; color:var(--muted);
  }
  .switch-btn.active.immo { background:var(--immo); color:#fff; }
  .switch-btn.active.arch { background:var(--arch); color:#fff; }

  .menu-section { padding:6px 12px 4px; font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:1.2px; font-weight:700; margin-top:10px; }
  .nav-item {
    padding:10px 14px; margin:2px 8px; border-radius:8px; cursor:pointer;
    font-size:13.5px; color:#c4cede; display:flex; align-items:center;
    gap:10px; transition:.15s; position:relative;
  }
  .nav-item:hover { background:var(--card); color:#fff; }
  .nav-item.active { background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(236,72,153,.08)); color:#fff; font-weight:600; }
  .nav-item.active::before {
    content:''; position:absolute; left:0; top:20%; height:60%; width:3px;
    background:var(--immo); border-radius:0 3px 3px 0;
  }
  body.arch-mode .nav-item.active::before { background:var(--arch); }
  .nav-item .icon { width:18px; text-align:center; }
  .nav-item .badge {
    margin-left:auto; background:var(--danger); color:#fff; font-size:10px;
    padding:2px 6px; border-radius:8px; font-weight:700;
  }
  .nav-item .badge.blue { background:var(--immo); }
  .nav-item .badge.pink { background:var(--arch); }

  .main { flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; min-width:0; }
  .topbar {
    height:64px; border-bottom:1px solid var(--border); display:flex;
    align-items:center; padding:0 24px; gap:16px; background:var(--sidebar);
    flex-shrink:0;
  }
  .search {
    flex:1; max-width:420px; background:var(--bg); border:1px solid var(--border);
    border-radius:9px; padding:9px 14px; color:var(--text); font-size:13px;
    outline:none;
  }
  .search::placeholder { color:var(--muted); }
  .topbar-actions { margin-left:auto; display:flex; gap:10px; align-items:center; }
  .icon-btn {
    width:38px; height:38px; border-radius:9px; background:var(--card);
    border:1px solid var(--border); display:flex; align-items:center;
    justify-content:center; cursor:pointer; position:relative; font-size:16px;
    transition:.15s;
  }
  .icon-btn:hover { background:var(--card2); }
  .icon-btn .dot {
    position:absolute; top:8px; right:8px; width:8px; height:8px;
    background:var(--danger); border-radius:50%; border:2px solid var(--sidebar);
  }
  .avatar {
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg,var(--immo),var(--arch));
    display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:14px; cursor:pointer;
  }

  .content { flex:1; overflow-y:auto; padding:26px; }
  .content::-webkit-scrollbar { width:8px; }
  .content::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

  .page-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
  .page-head h1 { font-size:24px; font-weight:700; }
  .page-head p { color:var(--muted); font-size:13px; margin-top:4px; }
  .btn {
    border:none; padding:10px 18px; border-radius:9px; font-weight:600;
    font-size:13px; cursor:pointer; transition:.15s; display:inline-flex;
    align-items:center; gap:7px;
  }
  .btn-primary { background:var(--immo); color:#fff; }
  .btn-primary:hover { background:var(--immo-light); }
  body.arch-mode .btn-primary { background:var(--arch); }
  body.arch-mode .btn-primary:hover { background:var(--arch-light); }
  .btn-ghost { background:var(--card); color:var(--text); border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--card2); }

  .grid-4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
  .stat-card {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; transition:.2s;
  }
  .stat-card:hover { transform:translateY(-2px); border-color:var(--immo); }
  body.arch-mode .stat-card:hover { border-color:var(--arch); }
  .stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
  .stat-value { font-size:26px; font-weight:800; margin:6px 0; color:#fff; }
  .stat-sub { font-size:11.5px; color:var(--success); font-weight:600; }
  .stat-sub.neg { color:var(--danger); }

  .panel {
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:22px; margin-bottom:20px;
  }
  .panel h2 { font-size:16px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .panel h2 .count { background:var(--bg); color:var(--muted); font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; }

  .list-item {
    display:flex; align-items:center; gap:14px; padding:13px 14px;
    background:var(--card2); border-radius:10px; margin-bottom:8px;
    border-left:3px solid var(--immo); transition:.15s; cursor:pointer;
  }
  body.arch-mode .list-item { border-left-color:var(--arch); }
  .list-item:hover { background:#1f2b41; }
  .list-icon {
    width:40px; height:40px; border-radius:9px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .list-info { flex:1; min-width:0; }
  .list-info strong { display:block; font-size:13.5px; margin-bottom:3px; }
  .list-info small { color:var(--muted); font-size:11.5px; }
  .tag {
    padding:4px 10px; border-radius:7px; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px; white-space:nowrap;
  }
  .tag.blue { background:rgba(59,130,246,.15); color:var(--immo-light); }
  .tag.pink { background:rgba(236,72,153,.15); color:var(--arch-light); }
  .tag.green { background:rgba(16,185,129,.15); color:#34d399; }
  .tag.orange { background:rgba(245,158,11,.15); color:#fbbf24; }
  .tag.red { background:rgba(239,68,68,.15); color:#f87171; }
  .tag.purple { background:rgba(168,85,247,.15); color:#c084fc; }

  .tool-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .tool-card {
    background:var(--card2); border:1px solid var(--border); border-radius:12px;
    padding:16px; cursor:pointer; transition:.2s; text-align:center;
  }
  .tool-card:hover { border-color:var(--immo); transform:translateY(-2px); background:#1f2b41; }
  body.arch-mode .tool-card:hover { border-color:var(--arch); }
  .tool-card .tool-icon { font-size:26px; margin-bottom:8px; }
  .tool-card .tool-name { font-size:12.5px; font-weight:600; }
  .tool-card .tool-desc { font-size:10.5px; color:var(--muted); margin-top:4px; }

  .toast-container {
    position:fixed; top:20px; right:20px; z-index:9999;
    display:flex; flex-direction:column; gap:10px;
  }
  .toast {
    background:var(--card); border:1px solid var(--border);
    padding:14px 18px; border-radius:11px; min-width:280px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:12px;
    animation:slideIn .3s ease;
  }
  @keyframes slideIn { from{transform:translateX(400px);opacity:0} to{transform:translateX(0);opacity:1} }
  .toast .toast-icon { font-size:20px; }
  .toast .toast-text strong { display:block; font-size:13px; margin-bottom:2px; }
  .toast .toast-text small { color:var(--muted); font-size:11.5px; }

  .modal-overlay {
    position:fixed; inset:0; background:rgba(5,8,15,.8);
    display:none; align-items:center; justify-content:center;
    z-index:1000; backdrop-filter:blur(4px); padding:16px;
  }
  .modal-overlay.show { display:flex; }
  .modal {
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:28px; width:100%; max-width:520px;
    animation:popIn .25s ease;
  }
  @keyframes popIn { from{transform:scale(.95);opacity:0} to{transform:scale(1);opacity:1} }
  .modal h3 { font-size:18px; margin-bottom:8px; }
  .modal p { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:11.5px; color:var(--muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; background:var(--bg); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; color:var(--text);
    font-size:13px; outline:none; font-family:inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color:var(--immo);
  }
  body.arch-mode .form-group input:focus, body.arch-mode .form-group select:focus, body.arch-mode .form-group textarea:focus {
    border-color:var(--arch);
  }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }

  .hidden { display:none !important; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }

  @media(max-width:900px){
    body { flex-direction:column; }
    .sidebar { width:100%; height:auto; max-height:50vh; }
    .main { height:auto; min-height:50vh; }
    .grid-2 { grid-template-columns:1fr; }
    .search { max-width:100%; }
    .topbar { padding:0 12px; }
    .content { padding:16px; }
  }
</style>
</head>

/* ============================================================
   ÉTAT GLOBAL
   ============================================================ */
var currentMode = 'immo';
var currentPage = 'immo-dashboard';

/* ============================================================
   RENDU DU MENU
   ============================================================ */
function renderMenu() {
  var menu = currentMode === 'immo' ? MENU_IMMO : MENU_ARCH;
  var container = document.getElementById('menuContainer');
  container.innerHTML = '';
  menu.forEach(function(item) {
    if (item.section) {
      var s = document.createElement('div');
      s.className = 'menu-section';
      s.textContent = item.section;
      container.appendChild(s);
    } else {
      var el = document.createElement('div');
      el.className = 'nav-item' + (item.id === currentPage ? ' active' : '');
      var badgeHtml = item.badge ? '<span class="badge ' + (item.badgeClass||'') + '">' + item.badge + '</span>' : '';
      el.innerHTML = '<span class="icon">' + item.icon + '</span><span>' + item.label + '</span>' + badgeHtml;
      el.onclick = (function(id, label) {
        return function() { navigate(id, label); };
      })(item.id, item.label);
      container.appendChild(el);
    }
  });
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function navigate(pageId, label) {
  currentPage = pageId;
  renderMenu();
  renderPage(pageId, label);
}

/* ============================================================
   RENDU DES PAGES
   ============================================================ */
function renderPage(pageId, label) {
  var c = document.getElementById('content');
  var isImmo = pageId.indexOf('immo-') === 0;
  var color = isImmo ? 'blue' : 'pink';

  if (pageId === 'immo-dashboard') { c.innerHTML = dashboardImmo(); return; }
  if (pageId === 'arch-dashboard') { c.innerHTML = dashboardArch(); return; }

  var config = PAGES[pageId] || {
    title: label || 'Module',
    subtitle: 'Module en cours de développement',
    stats: [],
    items: [],
    tools: []
  };

  var statsHtml = '';
  if (config.stats && config.stats.length) {
    statsHtml = '<div class="grid-4">' + config.stats.map(function(s) {
      return '<div class="stat-card">' +
        '<div class="stat-label">' + s.label + '</div>' +
        '<div class="stat-value">' + s.value + '</div>' +
        '<div class="stat-sub ' + (s.neg?'neg':'') + '">' + (s.sub||'') + '</div>' +
        '</div>';
    }).join('') + '</div>';
  }

  var itemsHtml = '';
  if (config.items && config.items.length) {
    itemsHtml = '<div class="panel"><h2>📋 Éléments récents <span class="count">' + config.items.length + '</span></h2>' +
      config.items.map(function(i) {
        return '<div class="list-item" onclick="showToast(\'' + (i.icon||'📄') + '\',\'' + i.title + '\',\'' + (i.sub||'') + '\')">' +
          '<div class="list-icon">' + (i.icon||'📄') + '</div>' +
          '<div class="list-info"><strong>' + i.title + '</strong><small>' + (i.sub||'') + '</small></div>' +
          '<span class="tag ' + (i.tagClass||color) + '">' + (i.tag||'Actif') + '</span>' +
          '</div>';
      }).join('') + '</div>';
  }

  var toolsHtml = '';
  if (config.tools && config.tools.length) {
    toolsHtml = '<div class="panel"><h2>🛠️ Outils disponibles</h2><div class="tool-grid">' +
      config.tools.map(function(t) {
        return '<div class="tool-card" onclick="showToast(\'' + t.icon + '\',\'' + t.name + '\',\'' + (t.desc||'') + '\')">' +
          '<div class="tool-icon">' + t.icon + '</div>' +
          '<div class="tool-name">' + t.name + '</div>' +
          '<div class="tool-desc">' + (t.desc||'') + '</div>' +
          '</div>';
      }).join('') + '</div></div>';
  }

  c.innerHTML = '<div class="page-head">' +
    '<div><h1>' + config.title + '</h1><p>' + config.subtitle + '</p></div>' +
    '<div style="display:flex;gap:10px">' +
    '<button class="btn btn-ghost" onclick="showToast(\'📥\',\'Export\',\'Données exportées\')">📥 Exporter</button>' +
    '<button class="btn btn-primary" onclick="openCreateModal(\'' + config.title + '\')">+ Nouveau</button>' +
    '</div></div>' + statsHtml + itemsHtml + toolsHtml;
}

/* ============================================================
   SWITCHER
   ============================================================ */
document.querySelectorAll('.switch-btn').forEach(function(btn) {
  btn.onclick = function() {
    var mode = btn.getAttribute('data-mode');
    if (mode === currentMode) return;
    currentMode = mode;
    document.body.className = mode + '-mode';
    document.querySelectorAll('.switch-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentPage = mode === 'immo' ? 'immo-dashboard' : 'arch-dashboard';
    renderMenu();
    renderPage(currentPage, '');
    showToast(mode === 'immo' ? '🏢' : '📐',
      mode === 'immo' ? 'Espace Immobilier' : 'Espace Architecte',
      'Basculement effectué avec succès');
  };
});

/* ============================================================
   TOASTS
   ============================================================ */
function showToast(icon, title, sub) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<div class="toast-icon">' + icon + '</div><div class="toast-text"><strong>' + title + '</strong><small>' + sub + '</small></div>';
  c.appendChild(t);
  setTimeout(function() {
    t.style.opacity = '0';
    t.style.transform = 'translateX(400px)';
    t.style.transition = 'all .3s';
    setTimeout(function() { t.remove(); }, 300);
  }, 3500);
}

    '<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>' +
    '<button class="btn btn-primary" onclick="confirmCreate(\'' + title + '\')">✅ Créer</button>' +
    '</div>';
  overlay.classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function confirmCreate(title) {
  closeModal();
  showToast('✅', 'Création réussie', title + ' a été ajouté avec succès');
}

document.getElementById('modalOverlay').onclick = function(e) {
  if (e.target.id === 'modalOverlay') closeModal();
};
