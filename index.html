<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<title>ArchImmo Pro — Suite Immobilière & Architecturale</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Inter','Segoe UI',sans-serif; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0a0e1a; --sidebar:#0f1626; --card:#151d2e; --card2:#1a2438;
    --border:#243044; --text:#e8edf5; --muted:#8896ab;
    --immo:#3b82f6; --immo-light:#60a5fa; --arch:#ec4899; --arch-light:#f472b6;
    --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--text); display:flex; min-height:100vh; }

  /* ============ SIDEBAR ============ */
  .sidebar {
    width:280px; background:var(--sidebar); display:flex; flex-direction:column;
    border-right:1px solid var(--border); height:100vh; overflow-y:auto;
    flex-shrink:0; transition:transform .3s;
  }
  .sidebar::-webkit-scrollbar { width:5px; }
  .sidebar::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  .logo {
    padding:20px; font-size:19px; font-weight:800; letter-spacing:-.5px;
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;
  }
  .logo-icon {
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg,var(--immo),var(--arch));
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .logo span.gradient {
    background:linear-gradient(135deg,var(--immo-light),var(--arch-light));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }

  .switcher { display:flex; margin:12px; padding:4px; background:var(--bg);
    border-radius:10px; border:1px solid var(--border); }
  .switch-btn { flex:1; padding:9px; text-align:center; border-radius:7px;
    cursor:pointer; font-size:12px; font-weight:600; transition:.2s; color:var(--muted); }
  .switch-btn.active.immo { background:var(--immo); color:#fff; }
  .switch-btn.active.arch { background:var(--arch); color:#fff; }

  .menu-section { padding:6px 12px 4px; font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:1.2px; font-weight:700; margin-top:8px; }
  .nav-item { padding:10px 14px; margin:2px 8px; border-radius:8px; cursor:pointer;
    font-size:13px; color:#c4cede; display:flex; align-items:center;
    gap:10px; transition:.15s; position:relative; }
  .nav-item:hover { background:var(--card); color:#fff; }
  .nav-item.active { background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(236,72,153,.08)); color:#fff; font-weight:600; }
  .nav-item.active::before { content:''; position:absolute; left:0; top:20%; height:60%; width:3px;
    background:var(--immo); border-radius:0 3px 3px 0; }
  body.arch-mode .nav-item.active::before { background:var(--arch); }
  .nav-item .icon { width:18px; text-align:center; }
  .nav-item .badge { margin-left:auto; background:var(--danger); color:#fff;
    font-size:10px; padding:2px 6px; border-radius:8px; font-weight:700; }
  .nav-item .badge.blue { background:var(--immo); }
  .nav-item .badge.pink { background:var(--arch); }

  /* ============ MAIN ============ */
  .main { flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; min-width:0; }
  .topbar { height:60px; border-bottom:1px solid var(--border); display:flex;
    align-items:center; padding:0 16px; gap:10px; background:var(--sidebar); flex-shrink:0; }
  .menu-toggle { display:none; width:38px; height:38px; border-radius:9px;
    background:var(--card); border:1px solid var(--border); cursor:pointer;
    font-size:18px; color:var(--text); }
  .search { flex:1; max-width:420px; background:var(--bg); border:1px solid var(--border);
    border-radius:9px; padding:9px 14px; color:var(--text); font-size:13px; outline:none; }
  .search::placeholder { color:var(--muted); }
  .topbar-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .icon-btn { width:38px; height:38px; border-radius:9px; background:var(--card);
    border:1px solid var(--border); display:flex; align-items:center;
    justify-content:center; cursor:pointer; position:relative; font-size:16px; }
  .icon-btn:hover { background:var(--card2); }
  .icon-btn .dot { position:absolute; top:8px; right:8px; width:8px; height:8px;
    background:var(--danger); border-radius:50%; border:2px solid var(--sidebar); }
  .avatar { width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg,var(--immo),var(--arch));
    display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:13px; cursor:pointer; }

  /* ============ CONTENT ============ */
  .content { flex:1; overflow-y:auto; padding:22px; -webkit-overflow-scrolling:touch; }
  .content::-webkit-scrollbar { width:6px; }
  .content::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

  .page-head { display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .page-head h1 { font-size:22px; font-weight:700; }
  .page-head p { color:var(--muted); font-size:13px; margin-top:4px; }
  .page-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:none; padding:10px 16px; border-radius:9px; font-weight:600;
    font-size:13px; cursor:pointer; transition:.15s; display:inline-flex;
    align-items:center; gap:6px; }
  .btn-primary { background:var(--immo); color:#fff; }
  .btn-primary:hover { background:var(--immo-light); }
  body.arch-mode .btn-primary { background:var(--arch); }
  body.arch-mode .btn-primary:hover { background:var(--arch-light); }
  .btn-ghost { background:var(--card); color:var(--text); border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--card2); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-success { background:var(--success); color:#fff; }
  .btn-sm { padding:6px 10px; font-size:11.5px; }

  .grid-4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; transition:.2s; }
  .stat-card:hover { transform:translateY(-2px); border-color:var(--immo); }
  body.arch-mode .stat-card:hover { border-color:var(--arch); }
  .stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
  .stat-value { font-size:26px; font-weight:800; margin:6px 0; color:#fff; }
  .stat-sub { font-size:11.5px; color:var(--success); font-weight:600; }
  .stat-sub.neg { color:var(--danger); }

  .panel { background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:20px; margin-bottom:16px; }
  .panel h2 { font-size:15px; font-weight:700; margin-bottom:14px;
    display:flex; align-items:center; gap:8px; }
  .panel h2 .count { background:var(--bg); color:var(--muted); font-size:11px;
    padding:2px 8px; border-radius:10px; font-weight:600; }

  .list-item { display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:var(--card2); border-radius:10px; margin-bottom:8px;
    border-left:3px solid var(--immo); transition:.15s; cursor:pointer; }
  body.arch-mode .list-item { border-left-color:var(--arch); }
  .list-item:hover { background:#1f2b41; transform:translateX(2px); }
  .list-icon { width:38px; height:38px; border-radius:9px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .list-info { flex:1; min-width:0; }
  .list-info strong { display:block; font-size:13.5px; margin-bottom:3px; }
  .list-info small { color:var(--muted); font-size:11.5px; }
  .list-actions { display:flex; gap:4px; }
  .list-actions button { width:30px; height:30px; border-radius:7px;
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .list-actions button:hover { background:var(--card2); }
  .tag { padding:4px 10px; border-radius:7px; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
  .tag.blue { background:rgba(59,130,246,.15); color:var(--immo-light); }
  .tag.pink { background:rgba(236,72,153,.15); color:var(--arch-light); }
  .tag.green { background:rgba(16,185,129,.15); color:#34d399; }
  .tag.orange { background:rgba(245,158,11,.15); color:#fbbf24; }
  .tag.red { background:rgba(239,68,68,.15); color:#f87171; }
  .tag.purple { background:rgba(168,85,247,.15); color:#c084fc; }

  .tool-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .tool-card { background:var(--card2); border:1px solid var(--border); border-radius:12px;
    padding:16px; cursor:pointer; transition:.2s; text-align:center; }
  .tool-card:hover { border-color:var(--immo); transform:translateY(-2px); background:#1f2b41; }
  body.arch-mode .tool-card:hover { border-color:var(--arch); }
  .tool-card .tool-icon { font-size:24px; margin-bottom:8px; }
  .tool-card .tool-name { font-size:12.5px; font-weight:600; }
  .tool-card .tool-desc { font-size:10.5px; color:var(--muted); margin-top:4px; }

  .empty { text-align:center; padding:40px 20px; color:var(--muted); }
  .empty .empty-icon { font-size:48px; margin-bottom:12px; opacity:.5; }
  .empty h3 { font-size:15px; margin-bottom:6px; color:var(--text); }
  .empty p { font-size:12.5px; }

  .toast-container { position:fixed; top:70px; right:16px; z-index:9999;
    display:flex; flex-direction:column; gap:10px; max-width:340px; }
  .toast { background:var(--card); border:1px solid var(--border);
    padding:13px 16px; border-radius:11px; min-width:240px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:10px; animation:slideIn .3s ease; }
  @keyframes slideIn { from{transform:translateX(400px);opacity:0} to{transform:translateX(0);opacity:1} }
  .toast .toast-icon { font-size:20px; }
  .toast .toast-text strong { display:block; font-size:13px; margin-bottom:2px; }
  .toast .toast-text small { color:var(--muted); font-size:11.5px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(5,8,15,.85);
    display:none; align-items:center; justify-content:center;
    z-index:1000; backdrop-filter:blur(4px); padding:16px; }
  .modal-overlay.show { display:flex; }
  .modal { background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:24px; width:100%; max-width:520px;
    max-height:90vh; overflow-y:auto; animation:popIn .25s ease; }
  @keyframes popIn { from{transform:scale(.95);opacity:0} to{transform:scale(1);opacity:1} }
  .modal h3 { font-size:18px; margin-bottom:8px; }
  .modal > p { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .form-group { margin-bottom:12px; }
  .form-group label { display:block; font-size:11.5px; color:var(--muted);
    margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; background:var(--bg); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; color:var(--text);
    font-size:13.5px; outline:none; font-family:inherit; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color:var(--immo); }
  body.arch-mode .form-group input:focus, body.arch-mode .form-group select:focus, body.arch-mode .form-group textarea:focus {
    border-color:var(--arch); }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }

  .hidden { display:none !important; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }

  .overlay-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5);
    z-index:99; }
  .overlay-backdrop.show { display:block; }

  @media(max-width:900px){
    .sidebar { position:fixed; left:0; top:0; z-index:100;
      transform:translateX(-100%); box-shadow:4px 0 20px rgba(0,0,0,.5); }
    .sidebar.open { transform:translateX(0); }
    .menu-toggle { display:flex; align-items:center; justify-content:center; }
    .grid-2 { grid-template-columns:1fr; }
    .content { padding:14px; }
    .page-head h1 { font-size:19px; }
    .stat-value { font-size:22px; }
    .search { font-size:12.5px; padding:8px 12px; }
    .topbar-actions .icon-btn:nth-child(1) { display:none; }
  }
</style>
</head>
<body class="immo-mode">

<div class="overlay-backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="logo">
    <div class="logo-icon">🏛️</div>
    <div>ArchImmo <span class="gradient">Pro</span></div>
  </div>

  <div class="switcher">
    <div class="switch-btn immo active" data-mode="immo">🏢 Immobilier</div>
    <div class="switch-btn arch" data-mode="arch">📐 Architecte</div>
  </div>

  <div id="menuContainer"></div>
</aside>

<div class="main">
  <div class="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <input class="search" id="searchInput" placeholder="🔍 Rechercher..." oninput="handleSearch(this.value)">
    <div class="topbar-actions">
      <div class="icon-btn" onclick="loadDemo()" title="Charger données démo">🎬</div>
      <div class="icon-btn" onclick="showNotifications()">🔔<span class="dot" id="notifDot"></span></div>
      <div class="avatar" onclick="showProfile()">MD</div>
    </div>
  </div>

  <div class="content" id="content"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ============================================================
   BASE DE DONNÉES (localStorage)
   ============================================================ */
var DB = {
  biens: [],
  clients: [],
  projets: [],
  chantiers: [],
  taches: [],
  agenda: [],
  documents: [],
  factures: [],
  messages: [],
  notifications: []
};

function saveDB() {
  try { localStorage.setItem('archimmo_db', JSON.stringify(DB)); } catch(e) {}
}
function loadDB() {
  try {
    var saved = localStorage.getItem('archimmo_db');
    if (saved) DB = JSON.parse(saved);
  } catch(e) {}
}

function genId() { return Date.now() + Math.floor(Math.random()*1000); }

/* ============================================================
   DONNÉES DE DÉMO
   ============================================================ */

  ];

    {id:genId(), titre:'Diagnostic_DPE_T3.pdf', type:'Diagnostic', date:'05/03/2025', taille:'189 Ko'}
  ];

  ];

    {id:genId(), icon:'🤝', titre:'Nouvelle offre reçue', desc:'Maison Écully · 380 000 €', date:'Il y a 5 min', lu:false},
    {id:genId(), icon:'📧', titre:'Email de M. Martin', desc:'Demande visite T3', date:'Il y a 30 min', lu:false},

}

function clearAllData() {
  if (!confirm('⚠️ Effacer TOUTES les données ? Cette action est irréversible.')) return;
  DB = { biens:[], clients:[], projets:[], chantiers:[], taches:[], agenda:[], documents:[], factures:[], messages:[], notifications:[] };
  saveDB();
  renderPage(currentPage);
  showToast('🗑️', 'Données effacées', 'Toutes les données ont été supprimées');
}

function loadDemo() {
  if (!confirm('🎬 Charger les données de démonstration ? Cela va remplacer vos données actuelles.')) return;
  seedDemo();
  renderPage(currentPage);
  renderMenu();
  showToast('🎬', 'Démo chargée', 'Toutes les données ont été injectées');
}

/* ============================================================
   MENUS
   ============================================================ */
var MENU_IMMO = [
  { section:'Principal' },
  { id:'immo-dashboard', icon:'📊', label:'Tableau de bord' },
  { id:'immo-agenda', icon:'📅', label:'Agenda & Rendez-vous' },
  { id:'immo-messagerie', icon:'💬', label:'Messagerie' },

  { section:'Gestion Immobilière' },
  { id:'immo-biens', icon:'🏠', label:'Biens immobiliers' },
  { id:'immo-mandats', icon:'📜', label:'Mandats & Exclusivités' },
  { id:'immo-annonces', icon:'📢', label:'Annonces & Diffusion' },
  { id:'immo-visites', icon:'🚶', label:'Visites & Sélections' },
  { id:'immo-offres', icon:'🤝', label:'Offres & Négociations' },
  { id:'immo-compromis', icon:'✍️', label:'Compromis & Actes' },
  { id:'immo-locations', icon:'🔑', label:'Locations & Baux' },

var currentMode = 'immo';
var currentPage = 'immo-dashboard';
var searchTerm = '';

/* ============================================================
   RENDU MENU
   ============================================================ */
function renderMenu() {
  var menu = currentMode === 'immo' ? MENU_IMMO : MENU_ARCH;
  var container = document.getElementById('menuContainer');
  container.innerHTML = '';
  menu.forEach(function(item) {
    if (item.section) {
      var s = document.createElement('div');
      s.className = 'menu-section';
      s.textContent = item.section;
      container.appendChild(s);
    } else {
      var el = document.createElement('div');
      el.className = 'nav-item' + (item.id === currentPage ? ' active' : '');
      el.innerHTML = '<span class="icon">' + item.icon + '</span><span>' + item.label + '</span>';
      el.onclick = (function(id) { return function() { navigate(id); }; })(item.id);
      container.appendChild(el);
    }
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}

function navigate(pageId) {
  currentPage = pageId;
  renderMenu();
  renderPage(pageId);
  if (window.innerWidth <= 900) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('backdrop').classList.remove('show');
  }
}

  var c = document.getElementById('content');
  var isImmo = pageId.indexOf('immo-') === 0;
  var color = isImmo ? 'blue' : 'pink';

  if (pageId === 'immo-dashboard') { c.innerHTML = dashboardImmo(); return; }

  if (pageId === 'immo-biens') { c.innerHTML = pageBiens(); return; }

function calculCA() {
  var total = 0;
  DB.factures.forEach(function(f) {
    var m = f.montant.replace(/[^\d]/g,'');

  });
  return total.toLocaleString('fr-FR') + ' €';
}

function pageEstimation() {
  return '<div class="page-head"><div><h1>🧮 Estimation immobilière</h1><p>Calculateur de prix au m²</p></div></div>' +
    '<div class="panel"><h2>📊 Estimation rapide</h2>' +
    '<div class="form-group"><label>Surface (m²)</label><input id="est_surface" type="number" placeholder="Ex: 72"></div>' +
    '<div class="form-group"><label>Prix moyen au m² (€)</label><input id="est_prix" type="number" value="4850"></div>' +
    '<div class="form-group"><label>État du bien</label><select id="est_etat"><option value="1">Bon état</option><option value="1.15">Neuf / rénové</option><option value="0.85">À rafraîchir</option><option value="0.7">À rénover</option></select></div>' +
    '<button class="btn btn-primary" onclick="calculEstimation()" style="width:100%;justify-content:center">🧮 Calculer l\'estimation</button>' +
    '<div id="est_result" style="margin-top:16px"></div></div>';
}

function calculEstimation() {
  var s = parseFloat(document.getElementById('est_surface').value);
  var p = parseFloat(document.getElementById('est_prix').value);
  var coef = parseFloat(document.getElementById('est_etat').value);
  if (!s || !p) { showToast('⚠️', 'Erreur', 'Remplissez tous les champs'); return; }
  var estimation = s * p * coef;
  var mini = estimation * 0.92;
  var maxi = estimation * 1.08;
  document.getElementById('est_result').innerHTML = 
    '<div class="stat-card"><div class="stat-label">Estimation</div>' +
    '<div class="stat-value">' + Math.round(estimation).toLocaleString('fr-FR') + ' €</div>' +
    '<div class="stat-sub">Fourchette : ' + Math.round(mini).toLocaleString('fr-FR') + ' € — ' + Math.round(maxi).toLocaleString('fr-FR') + ' €</div></div>';
  showToast('✅', 'Estimation calculée', Math.round(estimation).toLocaleString('fr-FR') + ' €');
}

/* ============================================================
   MODALES
   ============================================================ */
function showModal(title, bodyHtml, onConfirm, readOnly) {
  var overlay = document.getElementById('modalOverlay');
  var content = document.getElementById('modalContent');
  var actions = readOnly ?
    '<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>' :
    '<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>' +
    '<button class="btn btn-primary" id="modalConfirmBtn">✅ Confirmer</button>';
  content.innerHTML = '<h3>' + title + '</h3>' + bodyHtml + '<div class="modal-actions">' + actions + '</div>';
  overlay.classList.add('show');
  if (onConfirm && !readOnly) {
    document.getElementById('modalConfirmBtn').onclick = onConfirm;
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').onclick = function(e) {
  if (e.target.id === 'modalOverlay') closeModal();
};

/* ============================================================
   TOASTS
   ============================================================ */
function showToast(icon, title, sub) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<div class="toast-icon">' + icon + '</div><div class="toast-text"><strong>' + title + '</strong><small>' + sub + '</small></div>';
  c.appendChild(t);
  setTimeout(function() {
    t.style.opacity = '0';
    t.style.transform = 'translateX(400px)';
    t.style.transition = 'all .3s';
    setTimeout(function() { t.remove(); }, 300);
  }, 3200);
}

/* ============================================================
   SWITCHER
   ============================================================ */
document.querySelectorAll('.switch-btn').forEach(function(btn) {
  btn.onclick = function() {
    var mode = btn.getAttribute('data-mode');
    if (mode === currentMode) return;
    currentMode = mode;
    document.body.className = mode + '-mode';
    document.querySelectorAll('.switch-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentPage = mode === 'immo' ? 'immo-dashboard' : 'arch-dashboard';
    renderMenu();
    renderPage(currentPage);
    showToast(mode === 'immo' ? '🏢' : '📐',
      mode === 'immo' ? 'Espace Immobilier' : 'Espace Architecte',
      'Basculement effectué');
  };
});

   INITIALISATION
   ============================================================ */
loadDB();

}, 600);
