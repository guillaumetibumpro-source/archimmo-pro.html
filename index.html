<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<title>ArchImmo Pro — Suite Immobilière & Architecturale</title>

<!-- Bibliothèques externes -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Inter','Segoe UI',sans-serif; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0a0e1a; --sidebar:#0f1626; --card:#151d2e; --card2:#1a2438;
    --border:#243044; --text:#e8edf5; --muted:#8896ab;
    --immo:#3b82f6; --immo-light:#60a5fa; --arch:#ec4899; --arch-light:#f472b6;
    --success:#10b981; --warning:#f59e0b; --danger:#ef4444; --ia:#a855f7;
  }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--text); display:flex; min-height:100vh; }

  .sidebar { width:280px; background:var(--sidebar); display:flex; flex-direction:column;
    border-right:1px solid var(--border); height:100vh; overflow-y:auto; flex-shrink:0; transition:transform .3s; }
  .sidebar::-webkit-scrollbar { width:5px; }
  .sidebar::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  .logo { padding:20px; font-size:19px; font-weight:800; letter-spacing:-.5px;
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .logo-icon { width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg,var(--immo),var(--arch));
    display:flex; align-items:center; justify-content:center; font-size:18px; }
  .logo span.gradient { background:linear-gradient(135deg,var(--immo-light),var(--arch-light));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .switcher { display:flex; margin:12px; padding:4px; background:var(--bg);
    border-radius:10px; border:1px solid var(--border); }
  .switch-btn { flex:1; padding:9px; text-align:center; border-radius:7px;
    cursor:pointer; font-size:12px; font-weight:600; transition:.2s; color:var(--muted); }
  .switch-btn.active.immo { background:var(--immo); color:#fff; }
  .switch-btn.active.arch { background:var(--arch); color:#fff; }

  .menu-section { padding:6px 12px 4px; font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:1.2px; font-weight:700; margin-top:8px; }
  .nav-item { padding:10px 14px; margin:2px 8px; border-radius:8px; cursor:pointer;
    font-size:13px; color:#c4cede; display:flex; align-items:center;
    gap:10px; transition:.15s; position:relative; }
  .nav-item:hover { background:var(--card); color:#fff; }
  .nav-item.active { background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(236,72,153,.08)); color:#fff; font-weight:600; }
  .nav-item.active::before { content:''; position:absolute; left:0; top:20%; height:60%; width:3px;
    background:var(--immo); border-radius:0 3px 3px 0; }
  body.arch-mode .nav-item.active::before { background:var(--arch); }
  .nav-item .icon { width:18px; text-align:center; }
  .nav-item .badge { margin-left:auto; background:var(--danger); color:#fff;
    font-size:10px; padding:2px 6px; border-radius:8px; font-weight:700; }

  .main { flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; min-width:0; }
  .topbar { height:60px; border-bottom:1px solid var(--border); display:flex;
    align-items:center; padding:0 16px; gap:10px; background:var(--sidebar); flex-shrink:0; }
  .menu-toggle { display:none; width:38px; height:38px; border-radius:9px;
    background:var(--card); border:1px solid var(--border); cursor:pointer; font-size:18px; color:var(--text); }
  .search { flex:1; max-width:420px; background:var(--bg); border:1px solid var(--border);
    border-radius:9px; padding:9px 14px; color:var(--text); font-size:13px; outline:none; }
  .search::placeholder { color:var(--muted); }
  .topbar-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .icon-btn { width:38px; height:38px; border-radius:9px; background:var(--card);
    border:1px solid var(--border); display:flex; align-items:center;
    justify-content:center; cursor:pointer; position:relative; font-size:16px; }
  .icon-btn:hover { background:var(--card2); }
  .icon-btn .dot { position:absolute; top:8px; right:8px; width:8px; height:8px;
    background:var(--danger); border-radius:50%; border:2px solid var(--sidebar); }
  .avatar { width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg,var(--immo),var(--arch));
    display:flex; align-items:center; justify-content:center; font-weight:700;
    font-size:13px; cursor:pointer; }

  .content { flex:1; overflow-y:auto; padding:22px; -webkit-overflow-scrolling:touch; }
  .content::-webkit-scrollbar { width:6px; }
  .content::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

  .page-head { display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .page-head h1 { font-size:22px; font-weight:700; }
  .page-head p { color:var(--muted); font-size:13px; margin-top:4px; }
  .page-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:none; padding:10px 16px; border-radius:9px; font-weight:600;
    font-size:13px; cursor:pointer; transition:.15s; display:inline-flex;
    align-items:center; gap:6px; }
  .btn-primary { background:var(--immo); color:#fff; }
  .btn-primary:hover { background:var(--immo-light); }
  body.arch-mode .btn-primary { background:var(--arch); }
  body.arch-mode .btn-primary:hover { background:var(--arch-light); }
  .btn-ghost { background:var(--card); color:var(--text); border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--card2); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-ia { background:linear-gradient(135deg,var(--ia),#6366f1); color:#fff; }
  .btn-sm { padding:6px 10px; font-size:11.5px; }

  .grid-4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; transition:.2s; }
  .stat-card:hover { transform:translateY(-2px); border-color:var(--immo); }
  body.arch-mode .stat-card:hover { border-color:var(--arch); }
  .stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
  .stat-value { font-size:26px; font-weight:800; margin:6px 0; color:#fff; }
  .stat-sub { font-size:11.5px; color:var(--success); font-weight:600; }
  .stat-sub.neg { color:var(--danger); }

  .panel { background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:20px; margin-bottom:16px; }
  .panel h2 { font-size:15px; font-weight:700; margin-bottom:14px;
    display:flex; align-items:center; gap:8px; }
  .panel h2 .count { background:var(--bg); color:var(--muted); font-size:11px;
    padding:2px 8px; border-radius:10px; font-weight:600; }

  .list-item { display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:var(--card2); border-radius:10px; margin-bottom:8px;
    border-left:3px solid var(--immo); transition:.15s; cursor:pointer; }
  body.arch-mode .list-item { border-left-color:var(--arch); }
  .list-item:hover { background:#1f2b41; transform:translateX(2px); }
  .list-icon { width:38px; height:38px; border-radius:9px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .list-info { flex:1; min-width:0; }
  .list-info strong { display:block; font-size:13.5px; margin-bottom:3px; }
  .list-info small { color:var(--muted); font-size:11.5px; }
  .list-actions { display:flex; gap:4px; }
  .list-actions button { width:30px; height:30px; border-radius:7px;
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .list-actions button:hover { background:var(--card2); }
  .tag { padding:4px 10px; border-radius:7px; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
  .tag.blue { background:rgba(59,130,246,.15); color:var(--immo-light); }
  .tag.pink { background:rgba(236,72,153,.15); color:var(--arch-light); }
  .tag.green { background:rgba(16,185,129,.15); color:#34d399; }
  .tag.orange { background:rgba(245,158,11,.15); color:#fbbf24; }
  .tag.red { background:rgba(239,68,68,.15); color:#f87171; }
  .tag.purple { background:rgba(168,85,247,.15); color:#c084fc; }

  .tool-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .tool-card { background:var(--card2); border:1px solid var(--border); border-radius:12px;
    padding:16px; cursor:pointer; transition:.2s; text-align:center; }
  .tool-card:hover { border-color:var(--immo); transform:translateY(-2px); background:#1f2b41; }
  .tool-card .tool-icon { font-size:24px; margin-bottom:8px; }
  .tool-card .tool-name { font-size:12.5px; font-weight:600; }
  .tool-card .tool-desc { font-size:10.5px; color:var(--muted); margin-top:4px; }

  .empty { text-align:center; padding:40px 20px; color:var(--muted); }
  .empty .empty-icon { font-size:48px; margin-bottom:12px; opacity:.5; }
  .empty h3 { font-size:15px; margin-bottom:6px; color:var(--text); }
  .empty p { font-size:12.5px; }

  /* ===== ASSISTANT IA ===== */
  .ia-panel { background:linear-gradient(135deg,rgba(168,85,247,.1),rgba(99,102,241,.1));
    border:1px solid rgba(168,85,247,.4); border-radius:16px; padding:22px; margin-bottom:20px; }
  .ia-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .ia-avatar { width:44px; height:44px; border-radius:12px;
    background:linear-gradient(135deg,var(--ia),#6366f1);
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  .ia-title { font-size:16px; font-weight:700; }
  .ia-sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .ia-chat { background:var(--bg); border-radius:12px; padding:14px;
    max-height:340px; overflow-y:auto; margin-bottom:12px; min-height:160px; }
  .ia-msg { display:flex; gap:10px; margin-bottom:12px; animation:fadeIn .3s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
  .ia-msg .bubble { padding:10px 14px; border-radius:12px; font-size:13.5px;
    max-width:80%; line-height:1.4; }
  .ia-msg.user { flex-direction:row-reverse; }
  .ia-msg.user .bubble { background:var(--ia); color:#fff; }
  .ia-msg.bot .bubble { background:var(--card2); }
  .ia-suggestions { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .ia-chip { background:var(--card2); border:1px solid var(--border); color:var(--text);
    padding:6px 12px; border-radius:16px; font-size:11.5px; cursor:pointer; transition:.15s; }
  .ia-chip:hover { background:var(--ia); color:#fff; border-color:var(--ia); }
  .ia-input-row { display:flex; gap:8px; }
  .ia-input { flex:1; background:var(--bg); border:1px solid var(--border);
    border-radius:9px; padding:11px 14px; color:var(--text); font-size:13.5px; outline:none; }
  .ia-input:focus { border-color:var(--ia); }
  .ia-send { background:var(--ia); color:#fff; border:none; border-radius:9px;
    padding:0 18px; font-weight:600; cursor:pointer; font-size:14px; }

  /* ===== VISUALISEUR 3D ===== */
  .viewer-3d { width:100%; height:400px; background:linear-gradient(180deg,#1a2438,#0f1626);
    border-radius:12px; overflow:hidden; position:relative; }
  .viewer-3d canvas { display:block; }
  .viewer-controls { position:absolute; bottom:12px; right:12px; display:flex; gap:6px; }
  .viewer-controls button { background:rgba(0,0,0,.5); color:#fff; border:1px solid rgba(255,255,255,.2);
    padding:8px 12px; border-radius:8px; cursor:pointer; font-size:12px; }

  /* ===== SIGNATURE ===== */
  .sig-canvas { width:100%; height:200px; background:#fff; border-radius:10px;
    touch-action:none; cursor:crosshair; }

  /* ===== CARTE ===== */
  .map-container { width:100%; height:400px; border-radius:12px; overflow:hidden; }
  .leaflet-container { background:#1a2438; }

  /* ===== GRAPHIQUES ===== */
  .chart-box { background:var(--card2); border-radius:12px; padding:16px; height:280px; }

  /* ===== TOASTS / MODALE ===== */
  .toast-container { position:fixed; top:70px; right:16px; z-index:9999;
    display:flex; flex-direction:column; gap:10px; max-width:340px; }
  .toast { background:var(--card); border:1px solid var(--border);
    padding:13px 16px; border-radius:11px; min-width:240px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:10px; animation:slideIn .3s ease; }
  @keyframes slideIn { from{transform:translateX(400px);opacity:0} to{transform:translateX(0);opacity:1} }
  .toast .toast-icon { font-size:20px; }
  .toast .toast-text strong { display:block; font-size:13px; margin-bottom:2px; }
  .toast .toast-text small { color:var(--muted); font-size:11.5px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(5,8,15,.85);
    display:none; align-items:center; justify-content:center;
    z-index:1000; backdrop-filter:blur(4px); padding:16px; }
  .modal-overlay.show { display:flex; }
  .modal { background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:24px; width:100%; max-width:520px;
    max-height:90vh; overflow-y:auto; animation:popIn .25s ease; }
  @keyframes popIn { from{transform:scale(.95);opacity:0} to{transform:scale(1);opacity:1} }
  .modal h3 { font-size:18px; margin-bottom:8px; }
  .modal > p { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .form-group { margin-bottom:12px; }
  .form-group label { display:block; font-size:11.5px; color:var(--muted);
    margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; background:var(--bg); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; color:var(--text);
    font-size:13.5px; outline:none; font-family:inherit; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color:var(--immo); }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }

  .hidden { display:none !important; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  .overlay-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:99; }
  .overlay-backdrop.show { display:block; }

  @media(max-width:900px){
    .sidebar { position:fixed; left:0; top:0; z-index:100;
      transform:translateX(-100%); box-shadow:4px 0 20px rgba(0,0,0,.5); }
    .sidebar.open { transform:translateX(0); }
    .menu-toggle { display:flex; align-items:center; justify-content:center; }
    .grid-2 { grid-template-columns:1fr; }
    .content { padding:14px; }
    .page-head h1 { font-size:19px; }
    .stat-value { font-size:22px; }
    .search { font-size:12.5px; padding:8px 12px; }
    .viewer-3d, .map-container { height:280px; }
  }
</style>
</head>
<body class="immo-mode">

<div class="overlay-backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="logo">
    <div class="logo-icon">🏛️</div>
    <div>ArchImmo <span class="gradient">Pro</span></div>
  </div>
  <div class="switcher">
    <div class="switch-btn immo active" data-mode="immo">🏢 Immobilier</div>
    <div class="switch-btn arch" data-mode="arch">📐 Architecte</div>
  </div>
  <div id="menuContainer"></div>
</aside>

<div class="main">
  <div class="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <input class="search" id="searchInput" placeholder="🔍 Rechercher..." oninput="handleSearch(this.value)">
    <div class="topbar-actions">
      <div class="icon-btn" onclick="loadDemo()" title="Charger démo">🎬</div>
      <div class="icon-btn" onclick="showNotifications()">🔔<span class="dot"></span></div>
      <div class="avatar" onclick="showProfile()">MD</div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ============================================================
   BASE DE DONNÉES
   ============================================================ */
var DB = { biens:[], clients:[], projets:[], chantiers:[], taches:[], agenda:[], documents:[], factures:[], messages:[], notifications:[] };

function saveDB() { try { localStorage.setItem('archimmo_db_v2', JSON.stringify(DB)); } catch(e) {} }
function loadDB() { try { var s = localStorage.getItem('archimmo_db_v2'); if (s) DB = JSON.parse(s); } catch(e) {} }
function genId() { return Date.now() + Math.floor(Math.random()*1000); }

function seedDemo() {
  DB.biens = [
    {id:genId(), titre:'Appartement T3 — Lyon 6e', type:'Vente', prix:'420 000 €', surface:'72 m²', adresse:'12 rue Duquesne, 69006 Lyon', desc:'Lumineux, balcon, proche métro.', statut:'Disponible', lat:45.7719, lng:4.8500},
    {id:genId(), titre:'Maison 5P — Écully', type:'Vente', prix:'680 000 €', surface:'145 m²', adresse:'5 chemin des Cerisiers, 69130 Écully', desc:'Jardin 400 m².', statut:'Sous offre', lat:45.7745, lng:4.7730},
    {id:genId(), titre:'Studio meublé — Villeurbanne', type:'Location', prix:'650 €/mois', surface:'24 m²', adresse:'8 rue de la Paix, 69100 Villeurbanne', desc:'Refait à neuf.', statut:'Loué', lat:45.7719, lng:4.8900},
    {id:genId(), titre:'Immeuble de rapport — Lyon 7e', type:'Vente', prix:'1 250 000 €', surface:'420 m²', adresse:'45 avenue Jean Jaurès, 69007 Lyon', desc:'Rentabilité 6,2%.', statut:'Disponible', lat:45.7300, lng:4.8400}
  ];
  DB.clients = [
    {id:genId(), nom:'M. & Mme Martin', type:'Acheteur', email:'martin@email.fr', tel:'06 12 34 56 78', budget:'450 000 €', notes:'Cherche T3 Lyon 6e'},
    {id:genId(), nom:'SCI Bellevue', type:'Investisseur', email:'contact@sci-bellevue.fr', tel:'04 78 12 34 56', budget:'1 500 000 €', notes:'Immeubles de rapport'},
    {id:genId(), nom:'M. Bernard', type:'Vendeur', email:'bernard@email.fr', tel:'06 98 76 54 32', budget:'', notes:'Vend maison Villeurbanne'}
  ];
  DB.projets = [
    {id:genId(), titre:'Villa contemporaine — Annecy', client:'Famille Rousseau', surface:'210 m²', budget:'680 000 €', statut:'Permis déposé', avancement:'45%'},
    {id:genId(), titre:'Rénovation Loft — Lyon 1er', client:'M. Petit', surface:'95 m²', budget:'342 000 €', statut:'Chantier', avancement:'65%'},
    {id:genId(), titre:'Maison passive — Grenoble', client:'M. & Mme Blanc', surface:'160 m²', budget:'420 000 €', statut:'Conception', avancement:'25%'}
  ];
  DB.chantiers = [
    {id:genId(), titre:'Loft Lyon 1er', client:'M. Petit', entreprise:'BTP Lyon SAS', avancement:'65%', budget:'342 000 €', fin:'30/04/2025', statut:'En cours'},
    {id:genId(), titre:'Villa Annecy', client:'Famille Rousseau', entreprise:'—', avancement:'0%', budget:'680 000 €', fin:'15/09/2025', statut:'À démarrer'}
  ];
  DB.taches = [
    {id:genId(), titre:'Rappeler M. Martin', desc:'Retour visite T3', date:'Aujourd\'hui', priorite:'Urgente', fait:false},
    {id:genId(), titre:'Préparer mandat Petit', desc:'Appartement Lyon 1er', date:'Demain', priorite:'Normale', fait:false}
  ];
  DB.agenda = [
    {id:genId(), titre:'Visite T3 Lyon 6e', heure:'10h00', date:'Aujourd\'hui', avec:'M. & Mme Martin', lieu:'12 rue Duquesne Lyon'},
    {id:genId(), titre:'Estimation Maison', heure:'14h00', date:'Aujourd\'hui', avec:'M. Bernard', lieu:'Villeurbanne'}
  ];
  DB.documents = [
    {id:genId(), titre:'Mandat_Exclusif_T3_Lyon6.pdf', type:'Mandat', date:'12/03/2025', taille:'245 Ko'}
  ];
  DB.factures = [
    {id:genId(), numero:'2025-0142', client:'SCI Bellevue', montant:'8 400 €', statut:'Payée', date:'01/03/2025'},
    {id:genId(), numero:'2025-0143', client:'M. Martin', montant:'4 200 €', statut:'En attente', date:'15/03/2025'}
  ];
  DB.messages = [
    {id:genId(), de:'M. Martin', texte:'Bonjour, possible de visiter samedi ?', date:'10:24', lu:false}
  ];
  DB.notifications = [
    {id:genId(), icon:'🤝', titre:'Nouvelle offre', desc:'Maison Écully · 380 000 €', date:'Il y a 5 min', lu:false}
  ];
  saveDB();
}

function clearAllData() {
  if (!confirm('⚠️ Effacer TOUTES les données ?')) return;
  DB = { biens:[], clients:[], projets:[], chantiers:[], taches:[], agenda:[], documents:[], factures:[], messages:[], notifications:[] };

}

function iaQuick(text) {
  document.getElementById('iaInput').value = text;
  iaSend();
}

function iaSend() {
  var input = document.getElementById('iaInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  iaAddMessage('user', text);
  iaHistory.push({role:'user', text:text});
  setTimeout(function() { iaProcess(text); }, 400);
}

function iaAddMessage(role, text) {
  var chat = document.getElementById('iaChat');
  var msg = document.createElement('div');
  msg.className = 'ia-msg ' + role;
  msg.innerHTML = '<div class="bubble">' + text + '</div>';
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function iaBotReply(text) {
  iaAddMessage('bot', text);
  iaHistory.push({role:'bot', text:text});
}

function iaProcess(text) {
  var t = text.toLowerCase();
  var result = null;

  // === Ajouter un RDV / agenda ===
  if (t.match(/rendez-vous|rdv|agenda|visite.*\d|planifie/)) {
    var heure = (t.match(/(\d{1,2})h(\d{2})?/) || t.match(/(\d{1,2}):(\d{2})/) || [])[0] || '14h00';
    var date = 'Aujourd\'hui';
    if (t.match(/demain/)) date = 'Demain';
    else if (t.match(/lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche/)) date = t.match(/lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche/)[0];
    var titre = text.replace(/ajoute[rz]?\s*(un|une)?\s*/i,'').replace(/rendez-vous|rdv/gi,'').trim();
    if (titre.length > 60) titre = titre.substring(0, 60);
    var rdv = { id:genId(), titre: titre || 'Rendez-vous', heure:heure, date:date, avec:'À préciser', lieu:'Agence' };
    DB.agenda.push(rdv);
    saveDB();
    result = '✅ <strong>Rendez-vous ajouté !</strong><br>📅 ' + rdv.titre + '<br>🕙 ' + rdv.heure + ' — ' + rdv.date + '<br><br>Voulez-vous que je prévienne le client par email ?';
    notify('📅', 'RDV ajouté', rdv.titre + ' — ' + rdv.heure);
    refreshDataIfNeeded();
    iaBotReply(result);
    return;
  }

  // === Ajouter une tâche ===
  if (t.match(/t[âa]che|todo|faire|rappel/)) {
    var prio = 'Normale';
    if (t.match(/urgent|important/)) prio = 'Urgente';
    if (t.match(/basse|plus tard/)) prio = 'Basse';
    var titreT = text.replace(/ajoute[rz]?\s*(une)?\s*t[âa]che\s*(urgente|normale|basse)?\s*:?\s*/i,'').trim();
    var tache = { id:genId(), titre: titreT || 'Tâche', desc:'Créée par l\'assistant', date:'Aujourd\'hui', priorite:prio, fait:false };
    DB.taches.push(tache);
    saveDB();
    result = '✅ <strong>Tâche créée !</strong><br>📝 ' + tache.titre + '<br>⚡ Priorité : ' + prio + '<br><br>Voulez-vous que je vous rappelle dans 1h ?';
    notify('✅', 'Tâche créée', tache.titre);
    refreshDataIfNeeded();
    iaBotReply(result);
    return;
  }

  // === Ajouter un bien ===
  if (t.match(/bien|appartement|maison|studio|immeuble|villa|ajoute.*\d+\s*(m2|m²|euros|€)/i)) {
    var prix = (text.match(/(\d{2,7})\s*(000|k€|€|euros|keuros)/i) || [])[0] || '—';
    var type = 'Vente';
    if (t.match(/lou|locat|mois/)) type = 'Location';
    var titreB = text.replace(/ajoute[rz]?\s*(un)?\s*bien\s*:?\s*/i,'').trim();
    if (titreB.length > 50) titreB = titreB.substring(0, 50);
    var bien = { id:genId(), titre: titreB || 'Nouveau bien', type:type, prix:prix, surface:'—', adresse:'—', desc:'Créé par l\'assistant', statut:'Disponible', lat:45.76, lng:4.83 };
    DB.biens.push(bien);
    saveDB();
    result = '✅ <strong>Bien ajouté au catalogue !</strong><br>🏠 ' + bien.titre + '<br>💰 ' + bien.prix + '<br>🏷️ ' + type + '<br><br>Voulez-vous que je génère la fiche PDF ?';
    notify('🏠', 'Bien ajouté', bien.titre);
    refreshDataIfNeeded();
    iaBotReply(result);
    return;
  }

  // === Ajouter un client ===
  if (t.match(/client|acheteur|vendeur|prospect|ajoute.*personne/i)) {
    var typeC = 'Acheteur';
    if (t.match(/vendeur/)) typeC = 'Vendeur';
    if (t.match(/invest/)) typeC = 'Investisseur';
    var budget = (text.match(/budget\s*(\d+)/i) || [])[1] || '—';
    var nom = text.replace(/ajoute[rz]?\s*(un|une)?\s*client\s*:?\s*/i,'').trim();
    if (nom.length > 40) nom = nom.substring(0, 40);
    var client = { id:genId(), nom: nom || 'Nouveau client', type:typeC, email:'—', tel:'—', budget:budget+' €', notes:'Créé par l\'assistant' };
    DB.clients.push(client);
    saveDB();
    result = '✅ <strong>Client créé !</strong><br>👤 ' + client.nom + '<br>🏷️ ' + client.type + '<br>💰 Budget : ' + client.budget + '<br><br>Voulez-vous que je lui envoie un email de bienvenue ?';
    notify('👤', 'Client ajouté', client.nom);
    refreshDataIfNeeded();
    iaBotReply(result);
    return;
  }

  // === Ajouter une facture ===
  if (t.match(/facture|facturation|honoraire/)) {
    var montant = (text.match(/(\d+)\s*(€|euros)/i) || [])[0] || '—';
    var clientF = '—';
    var clientsMatch = text.match(/pour\s+([A-Za-zéèàç\s]+)/i);
    if (clientsMatch) clientF = clientsMatch[1].trim();
    var num = '2025-' + String(Math.floor(Math.random()*9000)+1000);
    var fac = { id:genId(), numero:num, client:clientF, montant:montant, statut:'En attente', date:new Date().toLocaleDateString('fr-FR') };
    DB.factures.push(fac);
    saveDB();
    result = '✅ <strong>Facture créée !</strong><br>📄 N°' + num + '<br>👤 ' + clientF + '<br>💰 ' + montant + '<br><br>Voulez-vous que je génère le PDF ?';
    notify('💰', 'Facture créée', 'N°' + num + ' — ' + montant);
    refreshDataIfNeeded();
    iaBotReply(result);
    return;
  }

  // === Statistiques ===
  if (t.match(/combien|statistique|nombre|total|stats/)) {
    if (t.match(/bien|appart|maison|immeuble/)) {
      iaBotReply('📊 Vous avez actuellement <strong>' + DB.biens.length + ' biens</strong> dans votre catalogue.<br>🏠 Ventes : ' + DB.biens.filter(function(b){return b.type==='Vente';}).length + '<br>🔑 Locations : ' + DB.biens.filter(function(b){return b.type==='Location';}).length + '<br><br>Voulez-vous les voir sur la carte ?');
      return;
    }
    if (t.match(/client|contact/)) {
      iaBotReply('👥 Vous avez <strong>' + DB.clients.length + ' clients</strong> enregistrés.<br>🏷️ Acheteurs : ' + DB.clients.filter(function(c){return c.type==='Acheteur';}).length + '<br>📤 Vendeurs : ' + DB.clients.filter(function(c){return c.type==='Vendeur';}).length);
      return;
    }
    iaBotReply('📊 Voici vos stats :<br>🏠 Biens : ' + DB.biens.length + '<br>👥 Clients : ' + DB.clients.length + '<br>📐 Projets : ' + DB.projets.length + '<br>📅 RDV : ' + DB.agenda.length + '<br>✅ Tâches : ' + DB.taches.length + '<br>💰 Factures : ' + DB.factures.length);
    return;
  }

  // === Voir agenda ===
  if (t.match(/agenda|rendez-vous|rdv|aujourd/)) {
    if (DB.agenda.length === 0) { iaBotReply('📅 Votre agenda est vide. Voulez-vous que je crée un rendez-vous ?'); return; }
    var list = DB.agenda.map(function(a) { return '🕙 <strong>' + a.heure + '</strong> — ' + a.titre; }).join('<br>');
    iaBotReply('📅 Voici votre agenda :<br><br>' + list);
    return;
  }

  // === Rechercher ===
  if (t.match(/cherche|trouve|recherche/)) {
    var term = text.replace(/cherche[rz]?|trouve[rz]?|recherche[rz]?/gi,'').replace(/les?\s*(biens?|clients?|projets?)/gi,'').trim();
    if (!term) { iaBotReply('🔍 Que cherchez-vous exactement ? (ex: "cherche biens Lyon")'); return; }
    var found = DB.biens.filter(function(b){ return (b.titre+b.adresse).toLowerCase().indexOf(term.toLowerCase()) !== -1; });
    if (found.length === 0) { iaBotReply('😕 Aucun résultat pour "' + term + '". Essayez un autre mot-clé.'); return; }
    iaBotReply('🔍 J\'ai trouvé <strong>' + found.length + ' résultat(s)</strong> :<br><br>' + found.slice(0,5).map(function(b) { return '🏠 ' + b.titre + ' — ' + b.prix; }).join('<br>'));
    return;
  }

  // === PDF ===
  if (t.match(/pdf|fiche|document/)) {
    iaBotReply('📄 Je peux générer plusieurs types de PDF :<br>• Fiche bien<br>• Facture<br>• Mandat<br>• Rapport<br><br>Allez dans le menu <strong>📥 Génération PDF</strong> ou dites "génère la fiche du T3 Lyon".');
    return;
  }

  // === Aide ===
  if (t.match(/aide|help|que peux-tu|comment/)) {
    iaBotReply('🤖 Je peux vous aider à :<br><br>📅 Ajouter un RDV : <em>"RDV demain 14h visite T3"</em><br>✅ Créer une tâche : <em>"Tâche urgente : rappeler Martin"</em><br>🏠 Ajouter un bien : <em>"Bien T3 Lyon à 420000"</em><br>👤 Ajouter un client : <em>"Client Martin acheteur budget 350000"</em><br>💰 Créer une facture : <em>"Facture 8400€ SCI Bellevue"</em><br>📊 Voir les stats : <em>"Combien de biens ?"</em><br>🔍 Rechercher : <em>"Cherche biens Lyon"</em>');
    return;
  }

  // === Réponse par défaut ===
  iaBotReply('🤔 Je n\'ai pas bien compris. Essayez par exemple :<br>• <em>"RDV demain 14h visite Lyon"</em><br>• <em>"Tâche urgente : rappeler Martin"</em><br>• <em>"Bien T3 Lyon à 420000"</em><br>• <em>"Combien de biens ?"</em>');
}

/* ==== Assistant du dashboard ==== */
function iaDashQuick(text) { document.getElementById('iaInputDash').value = text; iaDashSend(); }
function iaDashSend() {
  var inp = document.getElementById('iaInputDash');
  var txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';
  var chat = document.getElementById('iaChatDash');
  chat.innerHTML += '<div class="ia-msg user"><div class="bubble">' + txt + '</div></div>';
  chat.scrollTop = chat.scrollHeight;
  setTimeout(function() {
    var oldChat = document.getElementById('iaChat');
    // Simulation : on utilise une logique simplifiée inline
    iaProcessInline(txt, chat);
  }, 300);
}

function iaProcessInline(text, chat) {
  var t = text.toLowerCase();
  var reply = '';
  var refresh = false;

  if (t.match(/rdv|rendez-vous|visite/)) {
    var heure = (t.match(/\d{1,2}h\d{0,2}/) || ['14h00'])[0];
    DB.agenda.push({id:genId(), titre: text.replace(/ajoute[rz]?\s*(un)?\s*(rdv|rendez-vous)?\s*/i,'').trim() || 'RDV', heure:heure, date:'Demain', avec:'À préciser', lieu:'Agence'});
    saveDB();
    reply = '✅ RDV ajouté : <strong>' + text + '</strong> à ' + heure;
    refresh = true;
  } else if (t.match(/t[âa]che|urgent/)) {
    DB.taches.push({id:genId(), titre: text, desc:'Assistant', date:'Aujourd\'hui', priorite: t.match(/urgent/)?'Urgente':'Normale', fait:false});
    saveDB();
    reply = '✅ Tâche créée : <strong>' + text + '</strong>';
    refresh = true;
  } else if (t.match(/combien|stats?|nombre/)) {
    reply = '📊 Biens : ' + DB.biens.length + ' · Clients : ' + DB.clients.length + ' · Projets : ' + DB.projets.length + ' · RDV : ' + DB.agenda.length;
  } else if (t.match(/agenda|rdv/)) {
    reply = DB.agenda.length ? DB.agenda.map(function(a){return '🕙 '+a.heure+' — '+a.titre;}).join('<br>') : '📅 Agenda vide';
  } else if (t.match(/chantier|projet/)) {
    DB.chantiers.push({id:genId(), titre: text, client:'À préciser', entreprise:'—', avancement:'0%', budget:'—', fin:'—', statut:'À démarrer'});
    saveDB();
    reply = '🏗️ Chantier créé : <strong>' + text + '</strong>';
    refresh = true;
  } else if (t.match(/bien|appart|maison/)) {
    DB.biens.push({id:genId(), titre: text, type:'Vente', prix:'—', surface:'—', adresse:'—', desc:'Assistant', statut:'Disponible', lat:45.76, lng:4.83});
    saveDB();
    reply = '🏠 Bien ajouté : <strong>' + text + '</strong>';
    refresh = true;
  } else {
    reply = '🤔 Je peux : ajouter RDV, tâche, bien, client, chantier, ou vous montrer vos stats. Reformulez !';
  }

  chat.innerHTML += '<div class="ia-msg bot"><div class="bubble">' + reply + '</div></div>';
  chat.scrollTop = chat.scrollHeight;
  if (refresh) { saveDB(); setTimeout(function() { renderPage(currentPage); }, 800); }
}

    '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn btn-ghost" onclick="clearSignature()">🗑️ Effacer</button>' +
    '<button class="btn btn-primary" onclick="saveSignature()">💾 Sauvegarder</button>' +
    '<button class="btn btn-primary" onclick="downloadSignaturePDF()">📥 Télécharger PDF</button>' +
    '</div></div>';
}
var sigCtx, sigDrawing = false;
function initSignatureCanvas() {
  var canvas = document.getElementById('sigCanvas');
  if (!canvas) return;
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle = '#0a0e1a';
  sigCtx.lineWidth = 2.5;
  sigCtx.lineCap = 'round';
  var getPos = function(e) {
    var r = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  canvas.onmousedown = function(e) { sigDrawing = true; var p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  canvas.onmousemove = function(e) { if (!sigDrawing) return; var p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); };
  canvas.onmouseup = function() { sigDrawing = false; };
  canvas.onmouseleave = function() { sigDrawing = false; };
  canvas.ontouchstart = function(e) { e.preventDefault(); sigDrawing = true; var p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  canvas.ontouchmove = function(e) { e.preventDefault(); if (!sigDrawing) return; var p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); };
  canvas.ontouchend = function() { sigDrawing = false; };
}
function clearSignature() { var c = document.getElementById('sigCanvas'); if (c) sigCtx.clearRect(0, 0, c.width, c.height); }
function saveSignature() { showToast('✅','Signature sauvegardée','Enregistrée avec succès'); }
function downloadSignaturePDF() {
  var c = document.getElementById('sigCanvas');
  if (!c) return;
  var imgData = c.toDataURL('image/png');
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF();
  doc.setFontSize(18);
  doc.text('Signature électronique', 20, 30);
  doc.setFontSize(11);
  doc.text('Signé le : ' + new Date().toLocaleString('fr-FR'), 20, 45);
  doc.addImage(imgData, 'PNG', 20, 60, 150, 60);
  doc.text('Document généré par ArchImmo Pro', 20, 200);
  doc.save('signature_' + Date.now() + '.pdf');
  showToast('📥','PDF téléchargé','signature.pdf');
}

    '</div></div>';

var viewer3d = { scene:null, camera:null, renderer:null, house:null, rotating:true };
function initViewer3D() {
  var container = document.getElementById('viewer3d');
  if (!container || typeof THREE === 'undefined') return;
  var w = container.offsetWidth, h = container.offsetHeight;
  viewer3d.scene = new THREE.Scene();
  viewer3d.scene.background = new THREE.Color(0x1a2438);
  viewer3d.camera = new THREE.PerspectiveCamera(50, w/h, 0.1, 1000);
  viewer3d.camera.position.set(6, 4, 8);
  viewer3d.camera.lookAt(0, 1, 0);
  viewer3d.renderer = new THREE.WebGLRenderer({ antialias:true });
  viewer3d.renderer.setSize(w, h);
  container.appendChild(viewer3d.renderer.domElement);

  // Lumières
  var ambient = new THREE.AmbientLight(0xffffff, 0.7);
  viewer3d.scene.add(ambient);
  var dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5, 10, 5);
  viewer3d.scene.add(dirLight);

  // Sol
  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.MeshStandardMaterial({ color:0x2a3a4a })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  viewer3d.scene.add(ground);

  // Maison
  viewer3d.house = new THREE.Group();
  var wallMat = new THREE.MeshStandardMaterial({ color:0xd4a373 });
  var roofMat = new THREE.MeshStandardMaterial({ color:0x8b0000 });
  var glassMat = new THREE.MeshStandardMaterial({ color:0x60a5fa, transparent:true, opacity:0.7 });
  // Murs
  var walls = new THREE.Mesh(new THREE.BoxGeometry(3, 2.5, 3), wallMat);
  walls.position.y = 1.25;
  viewer3d.house.add(walls);
  // Toit
  var roof = new THREE.Mesh(new THREE.ConeGeometry(2.5, 1.5, 4), roofMat);
  roof.position.y = 3.25;
  roof.rotation.y = Math.PI / 4;
  viewer3d.house.add(roof);
  // Porte
  var door = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.3), new THREE.MeshStandardMaterial({ color:0x3d2817 }));
  door.position.set(0, 0.65, 1.51);
  viewer3d.house.add(door);
  // Fenêtres
  [ -0.9, 0.9 ].forEach(function(x) {
    var win = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), glassMat);
    win.position.set(x, 1.6, 1.51);
    viewer3d.house.add(win);
  });
  // Cheminée
  var chimney = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1, 0.4), new THREE.MeshStandardMaterial({ color:0x666666 }));
  chimney.position.set(1, 3.5, 0);
  viewer3d.house.add(chimney);
  viewer3d.scene.add(viewer3d.house);

  // Interaction tactile
  var isDragging = false, prevX = 0;
  var el = viewer3d.renderer.domElement;
  el.addEventListener('mousedown', function(e){ isDragging = true; prevX = e.clientX; viewer3d.rotating = false; });
  el.addEventListener('mousemove', function(e){ if (!isDragging) return; viewer3d.house.rotation.y += (e.clientX - prevX) * 0.01; prevX = e.clientX; });
  el.addEventListener('mouseup', function(){ isDragging = false; });
  el.addEventListener('touchstart', function(e){ isDragging = true; prevX = e.touches[0].clientX; viewer3d.rotating = false; });
  el.addEventListener('touchmove', function(e){ if (!isDragging) return; viewer3d.house.rotation.y += (e.touches[0].clientX - prevX) * 0.01; prevX = e.touches[0].clientX; });

  animateViewer3D();
  window.addEventListener('resize', function() {
    if (!viewer3d.renderer) return;
    var w2 = container.offsetWidth, h2 = container.offsetHeight;
    viewer3d.camera.aspect = w2/h2;
    viewer3d.camera.updateProjectionMatrix();
    viewer3d.renderer.setSize(w2, h2);
  });
}
function animateViewer3D() {
  if (!viewer3d.renderer) return;
  requestAnimationFrame(animateViewer3D);
  if (viewer3d.rotating && viewer3d.house) viewer3d.house.rotation.y += 0.005;
  viewer3d.renderer.render(viewer3d.scene, viewer3d.camera);
}
function changeViewerColor(color) {
  if (viewer3d.house && viewer3d.house.children[0]) viewer3d.house.children[0].material.color.setHex(color);
  showToast('🎨','Couleur modifiée','');
}

function generatePDFBien(id) {
  var b = DB.biens.filter(function(x){return x.id===id;})[0];

  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF();
  doc.setFillColor(15, 22, 38);
  doc.rect(0, 0, 210, 40, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(22);
  doc.text('ArchImmo Pro', 20, 20);
  doc.setFontSize(11);
  doc.text('Fiche descriptive du bien', 20, 30);
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(18);
  doc.text(b.titre, 20, 60);
  doc.setFontSize(11);
  doc.text('Type : ' + b.type, 20, 75);
  doc.text('Prix : ' + b.prix, 20, 84);
  doc.text('Surface : ' + b.surface, 20, 93);
  doc.text('Adresse : ' + b.adresse, 20, 102);
  doc.text('Statut : ' + b.statut, 20, 111);

}
function generatePDFBiens() {

/* ============================================================
   MODALES / TOASTS
   ============================================================ */
function showModal(title, body, onConfirm, readOnly) {
  var overlay = document.getElementById('modalOverlay');
  var content = document.getElementById('modalContent');
  var actions = readOnly ? '<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>' :
    '<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>' +
    '<button class="btn btn-primary" id="modalConfirmBtn">✅ Confirmer</button>';
  content.innerHTML = '<h3>' + title + '</h3>' + body + '<div class="modal-actions">' + actions + '</div>';
  overlay.classList.add('show');
  if (onConfirm && !readOnly) document.getElementById('modalConfirmBtn').onclick = onConfirm;
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').onclick = function(e) { if (e.target.id === 'modalOverlay') closeModal(); };

function showToast(icon, title, sub) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<div class="toast-icon">' + icon + '</div><div class="toast-text"><strong>' + title + '</strong><small>' + sub + '</small></div>';
  c.appendChild(t);
  setTimeout(function() {
    t.style.opacity = '0'; t.style.transform = 'translateX(400px)'; t.style.transition = 'all .3s';
    setTimeout(function() { t.remove(); }, 300);
  }, 3200);
}
function notify(icon, titre, desc) {
  DB.notifications.unshift({id:genId(), icon:icon, titre:titre, desc:desc, date:'À l\'instant', lu:false});
  saveDB();
}

/* ============================================================
   SWITCHER
   ============================================================ */
document.querySelectorAll('.switch-btn').forEach(function(btn) {
  btn.onclick = function() {
    var mode = btn.getAttribute('data-mode');
    if (mode === currentMode) return;
    currentMode = mode;
    document.body.className = mode + '-mode';
    document.querySelectorAll('.switch-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentPage = mode === 'immo' ? 'immo-dashboard' : 'arch-dashboard';
    renderMenu();
    renderPage(currentPage);
    showToast(mode === 'immo' ? '🏢' : '📐', mode === 'immo' ? 'Immobilier' : 'Architecte', 'Espace changé');
  };
});
